services:
  postgres:
    image: postgres:17
    container_name: gold-shape-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_shape
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gold_shape_dev
    ports:
      - "5433:5432"
    volumes:
      - gold_shape_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gold_shape"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gold_shape_data:
